[package]
name = "secrets"
version = "0.1.0"
edition = "2021"
publish = false
authors = ["Emiliano Dalla Verde Marcozzi <6564766d@gmail.com>"]

[dependencies]
# Web framework
axum = { version = "0.8.1", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }

# Async runtime
tokio = { version = "1.33.0", features = ["rt-multi-thread", "macros", "signal"] }
async-trait = { version = "0.1.74" }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

# Logging & tracing
tracing = { version = "0.1.40" }
tracing-subscriber = { version = "0.3.17", features = ["env-filter", "json"] }

# Configuration
dotenvy = { version = "0.15" }

# Utilities
chrono = { version = "0.4" }
uuid = { version = "1.6.0", features = ["v4", "serde"] }
thiserror = "2.0.12"
anyhow = "1.0"

# Cryptography
aes-gcm = "0.10.3"
pbkdf2 = { version = "0.12.2", features = ["sha2"] }
sha2 = "0.10.8"
rand = "0.9.0"

# Templates
tera = "1.20.0"

[dev-dependencies]
serial_test = { version = "3.1.1" }
rstest = { version = "0.21.0" }
